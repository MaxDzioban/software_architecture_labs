services:
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "5005:5005"

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankdb
    ports:
      - "5432:5432"

  hazelcast-1:
    image: hazelcast/hazelcast:5.4.0
    container_name: hazelcast-1
    ports:
      - "5701:5701"

  hazelcast-2:
    image: hazelcast/hazelcast:5.4.0
    container_name: hazelcast-2
    ports:
      - "5702:5701"

  hazelcast-3:
    image: hazelcast/hazelcast:5.4.0
    container_name: hazelcast-3
    ports:
      - "5703:5701"

  logging-service-1:
    build: ./logging-service
    container_name: logging-service-1
    environment:
      INSTANCE_NAME: logging-service-1
      SERVICE_HOST: logging-service-1
      SERVICE_PORT: 5001
      CONFIG_SERVER_URL: http://config-server:5005
      HAZELCAST_MEMBERS: hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
    depends_on:
      - config-server
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3

  logging-service-2:
    build: ./logging-service
    container_name: logging-service-2
    environment:
      INSTANCE_NAME: logging-service-2
      SERVICE_HOST: logging-service-2
      SERVICE_PORT: 5001
      CONFIG_SERVER_URL: http://config-server:5005
      HAZELCAST_MEMBERS: hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
    depends_on:
      - config-server
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3

  logging-service-3:
    build: ./logging-service
    container_name: logging-service-3
    environment:
      INSTANCE_NAME: logging-service-3
      SERVICE_HOST: logging-service-3
      SERVICE_PORT: 5001
      CONFIG_SERVER_URL: http://config-server:5005
      HAZELCAST_MEMBERS: hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
    depends_on:
      - config-server
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3

  counter-service:
    build: ./counter-service
    container_name: counter-service
    environment:
      SERVICE_HOST: counter-service
      SERVICE_PORT: 5002
      CONFIG_SERVER_URL: http://config-server:5005
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bankdb
      HAZELCAST_MEMBERS: hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      QUEUE_NAME: counter-queue
    depends_on:
      - config-server
      - postgres
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3
    ports:
      - "5002:5002"

  facade-service:
    build: ./facade-service
    container_name: facade-service
    environment:
      SERVICE_HOST: facade-service
      SERVICE_PORT: 5000
      CONFIG_SERVER_URL: http://config-server:5005
      HAZELCAST_MEMBERS: hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      QUEUE_NAME: counter-queue
    depends_on:
      - config-server
      - counter-service
      - logging-service-1
      - logging-service-2
      - logging-service-3
    ports:
      - "5000:5000"